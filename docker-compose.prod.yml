name: share-expense

services:

  web:
    build:
      context: .
      target: production
    image: share-expense:${IMAGE_TAG:-local}
    env_file: .env.prod
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: ${VIRTUAL_HOST}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
        reservations: {memory: 128M}
    networks:
      - share-expense-net
      - proxy-network

  postgres:
    image: postgres:18-alpine
    env_file: .env.prod
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    networks:
      share-expense-net:
        aliases:
          - share-expense-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  share-expense-net:
    driver: bridge
  proxy-network:
    external: true
