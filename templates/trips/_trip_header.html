{% load i18n ui %}
<div class="trip-head">
  <div>
    <h1>{{ trip.name }}</h1>
    <p>{% if trip.country %}{{ trip.country.name }} · {% endif %}{% include "trips/_dates.html" %}{{ trip.base_currency }}</p>
  </div>
  {% if membership.is_owner %}<a class="icon-btn" href="{% url 'trip_settings' trip.id %}" aria-label="{% translate 'Trip settings' %}">{% icon "settings" %}</a>{% endif %}
</div>
<nav class="tabs" aria-label="{% translate 'Trip sections' %}">
  <a href="{% url 'trip' trip.id %}" {% if tab == "expenses" %}aria-current="page"{% endif %}>{% translate "Expenses" %}</a>
  <a href="{% url 'summary' trip.id %}" {% if tab == "summary" %}aria-current="page"{% endif %}>{% translate "Who pays whom" %}</a>
  <a href="{% url 'people' trip.id %}" {% if tab == "people" %}aria-current="page"{% endif %}>{% translate "People" %}</a>
</nav>
