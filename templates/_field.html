{% load ui %}<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error" id="{{ field.auto_id }}_error">{% icon "triangle-alert" %}<span>{{ error }}</span></p>{% endfor %}
</div>
