{% load i18n ui %}{% comment %}The bell of the trip header and the trips list: opens the notifications list, with the unread count in red.{% endcomment %}{% unread_notifications as unread %}<a class="icon-btn bell" href="{% url 'notifications' %}"{% if request.resolver_match.url_name == "notifications" %} aria-current="page"{% endif %} aria-label="{% if unread %}{% blocktranslate count n=unread %}Notifications, {{ n }} unread{% plural %}Notifications, {{ n }} unread{% endblocktranslate %}{% else %}{% translate 'Notifications' %}{% endif %}">{% icon "bell" %}{% if unread %}<span class="bell-count" aria-hidden="true">{% if unread > 99 %}99+{% else %}{{ unread }}{% endif %}</span>{% endif %}</a>
