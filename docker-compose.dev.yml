name: share-expense

services:

  web:
    build:
      context: .
      target: development
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      VIRTUAL_HOST: share-expense.local
      VIRTUAL_PORT: "8000"
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - share-expense-net
      - proxy-network
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      share-expense-net:
        aliases:
          - share-expense-postgres  # unique name: several projects share proxy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  share-expense-net:
    driver: bridge
  proxy-network:
    external: true
