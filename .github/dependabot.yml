# Opens pull requests into develop for newer versions, so security fixes are not missed:
# - the cloudflared image (daily; for example the 2026-10 eMudhra certificate advisory).
#   Only cloudflared is watched: a postgres major upgrade needs a planned migration.
# - Python packages in uv.lock (weekly).
# - the GitHub Actions used by .github/workflows (weekly).
version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "develop"
    allow:
      - dependency-name: "cloudflare/cloudflared"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
