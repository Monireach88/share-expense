name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: share_expense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/share_expense
      DJANGO_DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Test
        run: uv run pytest -q

  # Every push to main that passes the tests goes live. The runner joins the tailnet for the
  # length of the job, because the server has no public SSH; the deploy key can only run
  # scripts/deploy.sh (a forced command on the server), which deploys exactly this commit.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://share-expense.monireach.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SERVER: 100.92.87.110
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.SERVER }}

      - name: Deploy this commit
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # The server's own host key, so the job cannot be sent to another machine.
          echo "$SERVER ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDcGZAH/IuPF2hRLeq/F1Z4APG7nyfNwVfEiAWKC8pQ+" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "ops@$SERVER" "$GITHUB_SHA"
