[project]
name = "share-expense"
version = "0.1.0"
description = "Split group travel expenses fairly, including people whose share is covered by someone else."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1",
    "django>=6.1,<6.2",
    "django-allauth[socialaccount]>=65.23",
    "django-axes>=8.3",
    "django-countries>=9.1.0",
    "django-htmx>=1.29",
    "dnspython>=2.9.2",
    "gunicorn>=26",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3",
    "whitenoise>=6.12",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["real_email_check: run the invite email check without the test stub (the test mocks DNS itself)"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "polib>=1.2.0",
    "pytest>=9.1",
    "pytest-django>=4.14",
    "ruff>=0.17",
]
