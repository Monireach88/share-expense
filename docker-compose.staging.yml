name: share-expense-staging

# Staging: a small copy of production for testing develop before a release.
# Same services as docker-compose.prod.yml, with its own database, its own tunnel
# (its own address) and one app worker. It is meant to be stopped when not in use:
# scripts/staging.sh up | down | refresh (see DOCKER_SETUP.md, "Staging").
# restart: "no" keeps it stopped after a server reboot until someone starts it.

services:

  web:
    build:
      context: .
      target: production
    image: share-expense:staging
    env_file: .env.staging
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 384M}
    networks:
      - share-expense-staging-net

  postgres:
    image: postgres:18-alpine
    env_file: .env.staging
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: "no"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    networks:
      share-expense-staging-net:
        aliases:
          - share-expense-staging-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    # Sends every request for the tunnel's host name to the web service.
    command: tunnel --no-autoupdate run --url http://web:8000
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.staging}
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    networks:
      - share-expense-staging-net

volumes:
  postgres-data:

networks:
  share-expense-staging-net:
    driver: bridge
