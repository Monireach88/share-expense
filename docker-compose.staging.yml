name: share-expense-staging

# Staging: a small copy of production for testing develop before a release.
# Same services as docker-compose.prod.yml, with its own database, its own tunnel
# (its own address) and one app worker. It is meant to be stopped when not in use:
# scripts/staging.sh up | down | refresh (see DOCKER_SETUP.md, "Staging").
# restart: "no" keeps it stopped after a server reboot until someone starts it.

services:

  web:
    build:
      context: .
      target: production
    image: share-expense:staging
    # Only the variables the app reads (config/settings.py, scripts/start.sh), so the web
    # container never holds the tunnel token. A name without a value takes its value from
    # the --env-file (.env.staging); a name missing there stays unset and the app default
    # applies. A new app variable goes here, in both compose files, and in .env.example.
    environment:
      - DJANGO_DEBUG
      - DJANGO_SECRET_KEY
      - DJANGO_ALLOWED_HOSTS
      - DJANGO_CSRF_TRUSTED_ORIGINS
      - DJANGO_SECURE_HSTS_SECONDS
      - TIME_ZONE
      - LOG_LEVEL
      - DATABASE_URL
      - AXES_FAILURE_LIMIT
      - CLIENT_IP_HEADER
      - DEEPSEEK_API_KEY
      - DEEPSEEK_MODEL
      - DEEPSEEK_DAILY_LIMIT
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - EMAIL_HOST
      - EMAIL_PORT
      - EMAIL_USE_SSL
      - EMAIL_USE_TLS
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - EMAIL_TIMEOUT
      - DEFAULT_FROM_EMAIL
      - GUNICORN_WORKERS
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 384M}
    networks:
      - share-expense-staging-net

  postgres:
    image: postgres:18-alpine
    # Only its own three variables, from the --env-file; never the app's secrets.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.staging}
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    networks:
      share-expense-staging-net:
        aliases:
          - share-expense-staging-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    # Sends every request for the tunnel's host name to the web service.
    command: tunnel --no-autoupdate run --url http://web:8000
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.staging}
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    networks:
      - share-expense-staging-net

volumes:
  postgres-data:

networks:
  share-expense-staging-net:
    driver: bridge
